replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/tr-discoverswiss-gastronomy
  pullPolicy: IfNotPresent
  tag: sometaghere

imagePullSecrets:
  - name: container-registry-r

env:
  LOG_LEVEL: "DEBUG"
  MQ_QUEUE: api-crawler.discoverswiss-gastronomy
  MQ_EXCHANGE: routed
  MQ_KEY: api-crawler.discoverswiss-gastronomy
  MQ_CLIENT: tr-discoverswiss-gastronomy

  ODH_CORE_URL: "https://tourism.api.opendatahub.testingmachine.eu/v1"
  ODH_CORE_TOKEN_URL: "https://auth.opendatahub.testingmachine.eu/auth/realms/noi/protocol/openid-connect/token"
  ODH_CORE_TOKEN_CLIENT_ID: "discoverswiss-gastronomydata"
  ODH_CORE_REFERER: "https://importer.v2.opendatahub.testingmachine.eu/discoverswiss.gastronomy"
  RAW_DATA_BRIDGE_ENDPOINT: "http://raw-data-bridge.core.svc.cluster.local:2000"
  DEACTIVATE_AFTER: "12h"

  SERVICE_NAME: tr-discoverswiss-gastronomy
  TELEMETRY_TRACE_GRPC_ENDPOINT: tempo-distributor-discovery.monitoring.svc.cluster.local:4317

envSecret:
  ODH_CORE_TOKEN_CLIENT_SECRET: ""

envSecretRef:
  - name: MQ_URI
    secret: rabbitmq-svcbind
    key: uri
