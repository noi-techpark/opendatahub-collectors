openapi: 3.0.3
info:
  title: Loewenbytes Bikebox Provider API for Suedtirolmobile App
  version: 1.0.1
  contact:
    email: info@loewenbytes.com
  description: |
    # Welcome to the Loewenbytes Bikebox Provider API
    
    This API provides functionality for integrating with and managing Bikebox Provider services.
    
    ## Common notes
    
    ### Encoding
    
    Unless described in other ways, all requests MUST use, and all response WILL
    use, characters that are encoded in UTF-8.
    
    ### Localization
    
    This API provides localized text for DE, EN, IT, LAD.
    
    ### Common (global) Request Headers
    
    Not required.
    
    ### Common Error handling
    
    Unless otherwise noted, each API error response includes a X-ErrID Response
    Header, with an error id, that could be displayed to consumers for further
    error analysis.
    
    Additionally, each error response MAY contain a common error object $ref:
    '#/components/schemas/ErrorResponse'
    
    #### Response Status Error Codes
    
    Each API may response one of the standard HTTP Status Codes, even if not
    described for each API in detail:
    
    * 400 Bad Request – client sent an invalid request, such as lacking
    required request body or parameter or more conditions in the request data
    evaluated to false
    * 500 Internal Server Error – a generic error occurred on the server
    * 503 Server Unavailable Error –  server is currently unable to handle the request
    
    ## 🔐 Authentication Overview

    This API uses a **dual-token authentication model** that distinguishes between 1. **Access Tokens** for trusted
    applications / integrations and 2. **Customer Tokens** for customer-context access.
    
    Issued tokens should always be verified against the issuer’s **public cryptographic key**,
    which can be retrieved from `/auth/.well-known/jwks.json`.

    ### 1. 🔑 Access Token
    The **Access Token** (Bearer token) authenticates trusted applications and integrations.
    It can be obtained via the **OAuth 2.0 Client Credentials flow**:
    
    * Endpoint: `POST /oauth/token`
    * Grant type: `client_credentials`
    * The token represents your application or integration (not a user).
    * Reach out to **[info@loewenbytes.com](mailto:info@loewenbytes.com)** to request a `client_id` and `client_secret`.
    
    The **Access Token** is used for system-level API access, such as `/resources` endpoints.
    Furthermore, it is required to obtain **Customer Tokens** from `/customers` endpoints.
    
    **Example request:**
    ```http
    POST /oauth/token
    Content-Type: application/x-www-form-urlencoded
    
    grant_type=client_credentials&
    client_id=my-client-id&
    client_secret=my-client-secret
    ```
    
    **Example response:**
    ```json
    {
      "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
      "token_type": "Bearer",
      "expires_in": 3600,
      "scope": "bikesharing.read"
    }
    ```

    ### 2. 👤 Customer Token
    The **Customer Token** represents an authenticated customer or end user.
    It is obtained by providing a valid **Access Token**, along with customer-related data, at one of the following endpoints:
    - `POST /customers/signIn`
    - `POST /customers/signInMifareId`
    
    This API issues **Customer Tokens** only after successful verification of the customer through the Ticketing API
    provided by Scheidt & Bachmann GmbH.

    Please refer to the `/customers` endpoints for detailed request/response schemas.

    The **Customer Token** is used for all customer-specific API calls within the `/rentals` endpoints.
    It is also accepted for general `/resources` endpoints.


    **Example header:**
    ```http
    Authorization: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
    ```

servers:
  - url: https://{env}.app.loewenbytes.com/api/v1
    variables:
      env:
        enum:
          - test
        default: test

paths:

  /resources/locations:
    get:
      summary: Returns a list of available locations in the specified language.
      operationId: getLocations
      tags:
        - Resources
      parameters:
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
      security:
        - AccessToken: [ ]
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'

  /resources/stations:
    get:
      summary: Returns a list of stations by specified language, location and type.
      operationId: getStations
      tags:
        - Resources
      parameters:
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
        - in: query
          name: locationID
          schema:
            type: string
        - in: query
          name: typeStation
          schema:
            $ref: '#/components/schemas/StationType'
      security:
        - AccessToken: [ ]
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'

  /resources/station:
    get:
      summary: Return the requested station by language and stationID.
      operationId: getStation
      tags:
        - Resources
      parameters:
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
        - in: query
          name: stationID
          schema:
            type: string
          required: true
      security:
        - AccessToken: [ ]
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'

  /resources/availability:
    get:
      summary: Returns a list of available places for the specified station and period.
      operationId: getAvailablePlaces
      tags:
        - Resources
      parameters:
        - in: query
          name: stationID
          schema:
            type: string
          required: true
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: refillRequired
          schema:
            type: boolean
            default: false
      security:
        - AccessToken: [ ]
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceAvailabilityResponse'

  /resources/tickets:
    get:
      summary: Returns a list of texts in the specified language.
      operationId: getTexts
      tags:
        - Resources
      parameters:
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
      security:
        - AccessToken: [ ]
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'

  /rentals/reserve:
    put:
      summary: Creates a reservation.
      operationId: createReservation
      tags:
        - Rentals
      security:
        - CustomerToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PlaceReservationRequest'
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlaceReservationResponse'

  /rentals/activeList:
    get:
      summary: Read all active reservations.
      operationId: getReservations
      tags:
        - Rentals
      parameters:
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
        - in: query
          name: nDayAfterDeadline
          schema:
            type: integer
          required: true
      security:
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaceReservationDetailsResponse'

  /rentals/extendReserve:
    put:
      summary: Extend a reservation.
      operationId: extendReservations
      tags:
        - Rentals
      security:
        - CustomerToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PlaceReservationExtensionRequest'
      responses:
        200:
          description: Successfully extended.
        416:
          description: ErrorCode 'reserveNotInProgress'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
        417:
          description: ErrorCode 'placesNotAvailable'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'

  /rentals/availabiltyExtention:
    get:
      summary: Extend a reservation.
      operationId: getAvailabilityExtension
      tags:
        - Rentals
      parameters:
        - in: query
          name: reserveID
          schema:
            type: string
          required: true
        - in: query
          name: maxDaysToExtend
          schema:
            type: integer
          required: true
      security:
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlaceReservationExtensionResponse'

  /rentals/cancelReserve:
    put:
      summary: Delete a reservation.
      operationId: deleteReservation
      tags:
        - Rentals
      security:
        - CustomerToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PlaceCancellationRequest'
      responses:
        200:
          description: Reservation deleted.
        409:
          description: ErrorCode 'reservationAlreadystarted'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
        417:
          description: ErrorCode 'notFound'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'

  /rentals/reserveData:
    get:
      summary: Return reservation details for the specified reservationID.
      operationId: getReservationData
      tags:
        - Rentals
      parameters:
        - in: query
          name: reserveID
          schema:
            type: string
          required: true
        - in: query
          name: languageID
          schema:
            $ref: '#/components/schemas/Language'
          required: true
      security:
        - CustomerToken: [ ]
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PlaceReservationDetailsResponse'

  /rentals/unlockPark:
    post:
      summary: Unlock the door.
      operationId: unlockDoor
      tags:
        - Rentals
      security:
        - CustomerToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/UnlockDoorRequest'
      responses:
        200:
          description: Unlock command send.
        412:
          description: ErrorCode 'qrCodeNotValid'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
        416:
          description: ErrorCode 'reserveNotInProgress'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
        417:
          description: ErrorCode 'notFound'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
        550:
          description: ErrorCode 'hardwareUnlockError'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'

  /rentals/truncateReserve:
    put:
      summary: Truncate a reservation.
      operationId: truncateReservation
      tags:
        - Rentals
      security:
        - CustomerToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PlaceTruncationRequest'
      responses:
        200:
          description: Reservation truncated.
        416:
          description: ErrorCode 'reserveNotInProgress'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'

  /connect/token:
    post:
      summary: OAuth 2.0 Client Credentials Flow to obtain an Access Token (Bearer token) with clientId and clientSecret.
      description: |
        Use the OAuth 2.0 Client Credentials Flow to obtain an Access Token (Bearer token) that can then be used to access `/resources` or to obtain Customer Tokens via `/customers` endpoints.
      operationId: clientConnectToken
      tags:
        - Authentication
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ConnectTokenRequest'
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectTokenResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/signIn:
    post:
      summary: Request a Customer Token based on a ticket ID.
      description: |
        Use this endpoint to obtain a **Customer Token** by providing a valid **Access Token**
        together with the customer's **ticket ID**.
        
        The API issues **Customer Tokens** after verifying the customer through the Ticketing API
        provided by **Scheidt & Bachmann GmbH**.
      operationId: customersSignIn
      tags:
        - Authentication
      security:
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerTokenRequest'
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerTokenResponse'
        404:
          description: |
            Customer verification failed through the Ticketing API provided by **Scheidt & Bachmann GmbH**.
            
            The **ErrorResponse** object includes more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /customers/signInMifareId:
    post:
      summary: Request a Customer Token based on a mifare ID.
      description: |
        Use this endpoint to obtain a **Customer Token** by providing a valid **Access Token**
        together with the customer's **mifare ID**.

        The API issues **Customer Tokens** after verifying the customer through the Ticketing API
        provided by **Scheidt & Bachmann GmbH**.
      operationId: customersSignInMifareId
      tags:
        - Authentication
      security:
        - AccessToken: [ ]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerMiFareTokenRequest'
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerTokenResponse'
        404:
          description: |
            Customer verification failed through the Ticketing API provided by **Scheidt & Bachmann GmbH**.
            
            The **ErrorResponse** object includes more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refreshToken:
    post:
      summary: Refresh a Customer Token.
      description: |
        Use this endpoint to refresh a **Customer Token** issued from a previous customer sign-in via `/customers/signIn` or `/customers/signInMifareId`.
        
        **Note:** This endpoint requires sending the `refreshToken` as a body parameter instead of using the defined authorization header. This behavior may be adjusted in future versions if necessary.
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CustomerRefreshTokenRequest'
      responses:
        200:
          description: Returns the requested data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerTokenResponse'
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

      # /auth/.well-known/jwks.json defined wihtin LWS scope
      # get:
      #    summary: Get JSON Web Key Set (JWKS, see https://datatracker.ietf.org/doc/html/rfc7517) to verify tokens, that was created by this APIs issuer.

components:
  schemas:

    Language:
      type: string
      enum:
        - de
        - en
        - it
        - lld

    Ticket:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        shortDescription:
          type: string
        descriptionTitle:
          type: string
        descriptionDescription:
          type: string
        cancelTitle:
          type: string
        cancelDescription:
          type: string
        truncateTitle:
          type: string
        truncateDescription:
          type: string
        extendTitle:
          type: string
        extendDescription:
          type: string
        customerHelpTitle:
          type: string
        customerHelpText:
          type: string
        customerServicePhoneNumber:
          type: string
        image:
          type: string
        infoUrl:
          type: string
        maxDateToReserve:
          type: string
          format: date
        maxDaysToExtend:
          type: integer
      required:
        - name
        - description
        - shortDescription
        - descriptionTitle
        - descriptionDescription
        - cancelTitle
        - cancelDescription
        - truncateTitle
        - truncateDescription
        - extendTitle
        - extendDescription
        - customerHelpTitle
        - customerHelpText
        - customerServicePhoneNumber
        - image
        - infoUrl
        - maxDateToReserve
        - maxDaysToExtend

    Location:
      type: object
      properties:
        locationID:
          type: string
          example: 288
        name:
          type: string
        stations:
          type: array
          items:
            $ref: '#/components/schemas/StationStub'
      required:
        - locationID
        - name
        - stations

    StationType:
      description: |
        Type of the station, currently the following types are supported:
        * 5 = bikeBoxGroup
      type: integer

    StationState:
      description: |
        State of the station, currently the following states are supported:
        * 1 = in service
        * 2 = out-of-service
      type: integer

    Station:
      type: object
      properties:
        stationID:
          type: string
          example: 1890
        locationID:
          type: string
          example: 280
        locationName:
          type: string
          example: Brixen, Bahnhof
        name:
          type: string
          example: Station 1890
        type:
          $ref: '#/components/schemas/StationType'
        address:
          type: string
          example: Am Bahnhof 1, Brixen
        latitude:
          type: integer
          example: 0
        longitude:
          type: number
          example: 0
        state:
          $ref: '#/components/schemas/StationState'
        countFreePlacesAvailable_MuscularBikes:
          type: integer
          description: Places without charging option
        countFreePlacesAvailable_AssistedBikes:
          type: integer
          description: Places with refill option
        countFreePlacesAvailable:
          type: integer
          example: 32
        totalPlaces:
          type: integer
          example: 50
        places:
          type: array
          items:
            $ref: '#/components/schemas/Place'
      required:
        - stationID
        - locationID
        - locationName
        - name
        - type
        - address
        - latitude
        - longitude
        - state
        - countFreePlacesAvailable_MuscularBikes
        - countFreePlacesAvailable_AssistedBikes
        - countFreePlacesAvailable
        - totalPlaces

    StationStub:
      type: object
      properties:
        stationID:
          type: string
          example: 1890
        type:
          $ref: '#/components/schemas/StationType'
      required:
        - stationID
        - type

    PlaceType:
      description: |
        Type of the place, currently the following types are supported:
        * 1 = withoutRefill
        * 2 = withRefill
      type: integer

    PlaceState:
      description: |
        State of the place, currently the following types are supported:
        * 1 = free (in service)
        * 2 = occupied (in service)
        * 3 = out-of-service
      type: integer

    Place:
      type: object
      properties:
        position:
          type: integer
          example: 1
        type:
          $ref: '#/components/schemas/PlaceType'
        state:
          $ref: '#/components/schemas/PlaceState'
        level:
          type: integer
          example: 0
      required:
        - position
        - type
        - state
        - level

    PlaceAvailabilityResponse:
      type: object
      properties:
        position:
          type: integer
        type:
          $ref: '#/components/schemas/PlaceType'
        level:
          type: integer
        refillAvailable:
          type: boolean
      required:
        - position
        - type
        - level
        - refillAvailable

    PlaceReservationRequest:
      type: object
      properties:
        stationID:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        refillRequired:
          type: boolean
        position:
          type: integer
      required:
        - stationID
        - startDate
        - endDate
        - refillRequired
        - position

    PlaceReservationResponse:
      type: object
      properties:
        reserveID:
          type: string
      required:
        - reserveID

    PlaceReservationState:
      description: |
        State of the reservation, currently the following types are supported:
        * 1 = not yet started (reservation is active)
        * 2 = in progress (reservation is active)
        * 3 = terminated (reservation in inactive)
        * 99 = cancelled (reservation in inactive)
      type: integer

    PlaceReservationDetailsResponse:
      type: object
      properties:
        reserveID:
          type: string
        locationName:
          type: string
        stationID:
          type: string
        stationName:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        level:
          type: integer
        position:
          type: integer
        refillAvailable:
          type: boolean
        type:
          $ref: "#/components/schemas/PlaceType"
        state:
          $ref: "#/components/schemas/PlaceReservationState"
      required:
        - reserveID
        - locationName
        - stationID
        - stationName
        - startDate
        - endDate
        - level
        - position
        - refillAvailable
        - type
        - state

    PlaceReservationExtensionRequest:
      type: object
      properties:
        reserveID:
          type: string
        endDate:
          type: string
          format: date
      required:
        - reserveID
        - endDate

    PlaceReservationExtensionResponse:
      type: object
      properties:
        maxEndDate:
          type: string
          format: date
      required:
        - maxEndDate

    PlaceCancellationRequest:
      type: object
      properties:
        reserveID:
          type: string
      required:
        - reserveID

    PlaceTruncationRequest:
      type: object
      properties:
        reserveID:
          type: string
      required:
        - reserveID

    UnlockDoorRequest:
      type: object
      properties:
        reserveID:
          type: string
        qrCode:
          type: string
        latitude:
          type: integer
        longitude:
          type: integer
      required:
        - reserveID
        - qrCode
        - latitude
        - longitude

    ErrorResponse:
      type: object
      properties:
        errorCode:
          description: |
            Well-known error codes as defined in "Bike Box API Integration in südtirolmobil App - From app code" provided by Runelab Srl/Marco Brugali.
            
            **Note:** Additional error codes may be added on demand.
          type: string
          enum:
            - undefined
            - hardwareUnlockError
            - qrCodeNotValid
            - reserveNotInProgress
            - notFound
            - placesNotAvailable
            - reservationAlreadystarted
          readOnly: true
        errorMessage:
          type: string
          readOnly: true
      required:
        - errorCode
        - errorMessage

    ConnectTokenRequest:
      type: object
      properties:
        grant_type:
          type: string
          enum: [ client_credentials ]
        client_id:
          type: string
          minLength: 2
          maxLength: 200
          pattern: ^(\S).*(\S)$
        client_secret:
          type: string
          minLength: 2
          maxLength: 200
          pattern: ^(\S).*(\S)$
      required:
        - grant_type
        - client_id
        - client_secret

    ConnectTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJSUIsImtpZCI6IjNmNjcyNeyJhbGciOiJSUIsImtpZCI6IjN=
        expires_in:
          type: integer
          format: int64
          example: 3600
          description: Expiration in seconds
        token_type:
          type: string
          example: Bearer
        scope:
          type: string
          example: bikesharing.read
      required:
        - access_token
        - expires_in
        - token_type

    CustomerTokenRequest:
      type: object
      properties:
        ticket_id:
          type: string
          example: 807177111
      required:
        - ticket_id

    CustomerMiFareTokenRequest:
      type: object
      properties:
        mifare_id:
          type: string
          example: 807177111
      required:
        - mifare_id

    CustomerRefreshTokenRequest:
      description: Token request data, according to https://datatracker.ietf.org/doc/html/rfc6749#section-4.3.2
      type: object
      properties:
        grant_type:
          description: Value MUST be set to "refresh_token", see https://datatracker.ietf.org/doc/html/rfc6749#section-6
          type: string
          enum: [ refresh_token ]
        refresh_token:
          description: A refresh token issued to the client
          type: string
          minLength: 5
      required:
        - grant_type
        - refresh_token

    CustomerTokenResponse:
      type: object
      properties:
        tokenID:
          type: string
          example: eyJhbGciOiJSUIsImtpZCI6IjNmNjcyNeyJhbGciOiJSUIsImtpZCI6IjN=
        refreshToken:
          type: string
          example: eyJhbGciOiJSUIsImtpZCI6IjNmNjcyNeyJhbGciOiJSUIsImtpZCI6IjN=
      required:
        - tokenID
        - refreshToken

  securitySchemes:
    AccessToken:
      type: oauth2
      description: |
        Obtain an **Access Token** via the OAuth 2.0 Client Credentials flow.
        Contact **[info@loewenbytes.com](mailto:info@loewenbytes.com)** for `client_id` and `client_secret`.
      flows:
        clientCredentials:
          tokenUrl: https://test.app.loewenbytes.com/api/v1/oauth/token
          scopes: { }

    CustomerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Customer Token** for authenticated customers or end-users.
        Can be obtained via `/customers/signIn` or `/customers/signInMifareId`.
