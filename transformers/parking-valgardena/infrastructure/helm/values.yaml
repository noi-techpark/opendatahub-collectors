replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/tr-parking-valgardena
  pullPolicy: IfNotPresent
  tag: sometaghere

imagePullSecrets:
  - name: container-registry-r

env:
  # ODH Core Writer Connection
  LOG_LEVEL: "INFO"

  MQ_QUEUE: parking-valgardena.data
  MQ_EXCHANGE: routed
  MQ_KEY: parking-valgardena.data
  MQ_CLIENT: tr-parking-valgardena-data

  MQ_META_QUEUE: parking-valgardena.metadata
  MQ_META_EXCHANGE: routed
  MQ_META_KEY: parking-valgardena.metadata
  MQ_META_CLIENT: tr-parking-valgardena-metadata

  BDP_BASE_URL: http://bdp-core.core.svc.cluster.local
  BDP_PROVENANCE_VERSION:
  BDP_PROVENANCE_NAME:
  BDP_ORIGIN: GARDENA

  RAW_DATA_BRIDGE_ENDPOINT: http://raw-data-bridge.core.svc.cluster.local:2000

  # Station descriptions edited in the parking control tower, published through
  # rest-push. Required: the transformer refuses to start without it.
  REFTABLE_DB: valgardena
  REFTABLE_COLLECTION: parking-enrichment
  REFTABLE_KEY: key
  REFTABLE_MQ_QUEUE: tr-parking-valgardena-enrichment
  REFTABLE_MQ_KEY: valgardena.parking-enrichment
  # Everything the provider sends is published today, with or without a record.
  REFTABLE_GATE: "false"

  # Every station seen, and what was done with it, for the control tower.
  DISCOVERY_PROVIDER: valgardena/parking-discovery
  DISCOVERY_GONE_AFTER: "3"
  RAW_WRITER_URL: http://raw-writer-2.core.svc.cluster.local

  SERVICE_NAME: tr-parking-valgardena
  TELEMETRY_TRACE_GRPC_ENDPOINT: tempo-distributor-discovery.monitoring.svc.cluster.local:4317

envSecretRef:
  - name: MQ_URI
    secret: rabbitmq-svcbind
    key: uri
  - name: ODH_TOKEN_URL
    secret: oauth-collector
    key: tokenUri
  - name: ODH_CLIENT_ID
    secret: oauth-collector
    key: clientId
  - name: ODH_CLIENT_SECRET
    secret: oauth-collector
    key: clientSecret
