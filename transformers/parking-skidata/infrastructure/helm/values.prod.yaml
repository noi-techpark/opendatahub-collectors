replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/tr-parking-skidata
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: container-registry-r

env:
  LOG_LEVEL: "INFO"
  MQ_QUEUE: skidata.parking-stations
  MQ_EXCHANGE: routed
  MQ_KEY: skidata.parking-stations
  MQ_CLIENT: tr-parking-skidata

  BDP_BASE_URL: http://bdp-core.core.svc.cluster.local
  BDP_PROVENANCE_VERSION:
  BDP_PROVENANCE_NAME: tr-parking-skidata
  BDP_ORIGIN: skidata_dynamicdata

  RAW_DATA_BRIDGE_ENDPOINT: http://raw-data-bridge.core.svc.cluster.local:2000

  # Operator-authored enrichment: names, coordinates and netex attributes,
  # edited in the backoffice and collected into the lake. It lives in the
  # skidata database alongside the provider's own collections — the enrichment
  # describes skidata stations and nothing else, so scoping it to that vertical
  # keeps one database per data source rather than a shared bucket everything
  # has to agree on.
  REFTABLE_DB: skidata
  REFTABLE_COLLECTION: parking-enrichment
  REFTABLE_KEY: key
  REFTABLE_MQ_QUEUE: tr-parking-skidata-enrichment
  REFTABLE_MQ_KEY: skidata.parking-enrichment

  # Provider-derived reference flow: the facility->carpark topology and the
  # total capacity, republished by the collector. Never merged with operator
  # input — it is provider fact, not description.
  CATEGORIES_DB: skidata
  CATEGORIES_COLLECTION: counting-categories
  CATEGORIES_KEY: facility
  CATEGORIES_MQ_QUEUE: tr-parking-skidata-categories
  CATEGORIES_MQ_KEY: skidata.counting-categories

  SERVICE_NAME: tr-parking-skidata
  TELEMETRY_TRACE_GRPC_ENDPOINT: tempo-distributor-discovery.monitoring.svc.cluster.local:4317


  # OpenDataHub time-series API used at startup to hydrate the in-memory
  # cache with the latest free/occupied per (carpark, category).
  TS_API_BASE_URL: https://mobility.api.opendatahub.com
  TS_API_REFERER: tr-parking-skidata

envSecretRef:
  - name: MQ_URI
    secret: rabbitmq-svcbind
    key: uri
  - name: ODH_TOKEN_URL
    secret: oauth-collector
    key: tokenUri
  - name: ODH_CLIENT_ID
    secret: oauth-collector
    key: clientId
  - name: ODH_CLIENT_SECRET
    secret: oauth-collector
    key: clientSecret
  # Same OAuth realm reused by the timeseries client at startup.
  - name: TS_API_TOKEN_URL
    secret: oauth-collector
    key: tokenUri
