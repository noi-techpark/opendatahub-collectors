services:
  app:
    build:
      dockerfile: infrastructure/docker/Dockerfile
      context: .
      target: dev
    env_file:
      - .env
    volumes:
      - ./src:/code
      - pkg:/go/pkg/mod
    working_dir: /code
    networks:
      - default
      - ingestion
volumes:
  pkg:

networks:
  ingestion:
    name: ingestion
    external: true
