image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/tr-google-spreadsheet-centrotrevi-venues
  pullPolicy: IfNotPresent
  tag: latest

env:
  LOG_LEVEL: "DEBUG"
  MQ_QUEUE: spreadsheets.centro-trevi-venues
  MQ_EXCHANGE: routed
  MQ_KEY: spreadsheets.centro-trevi
  MQ_CLIENT: tr-google-spreadsheet-centrotrevi-venues-test
  PROVIDER: spreadsheets/centro-trevi

  RAW_DATA_BRIDGE_ENDPOINT: http://raw-data-bridge.core.svc.cluster.local:2000

  ODH_CORE_URL: https://tourism.api.opendatahub.testingmachine.eu/v1/
  ODH_CORE_TOKEN_URL: https://auth.opendatahub.testingmachine.eu/auth/realms/noi/protocol/openid-connect/token
  ODH_CORE_TOKEN_CLIENT_ID: odh-api-core-events-culture-serviceaccount

  SERVICE_NAME: tr-google-spreadsheet-centrotrevi-venues
  TELEMETRY_TRACE_GRPC_ENDPOINT: tempo-distributor-discovery.monitoring.svc.cluster.local:4317

envSecretRef:
  - name: MQ_URI
    secret: rabbitmq-svcbind
    key: uri

envSecret:
  ODH_CORE_TOKEN_CLIENT_SECRET: ""
