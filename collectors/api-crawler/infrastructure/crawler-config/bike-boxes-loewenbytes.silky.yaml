# Bike Boxen STA (Loewenbytes) - see transformers/bike-boxes-loewenbytes/documentation,
# built against 260430_openapi-suedtirolmobile-bikebox-api-loewenbytes-v1.0.1.yaml.
#
# tokenUrl: the OpenAPI spec is internally inconsistent (securitySchemes
# says /oauth/token, paths says /connect/token). Verified live against the
# test environment on 2026-08-10: /oauth/token 404s, /connect/token is the
# real endpoint (body-param client_credentials, per the spec's own example).
rootContext: {}
stream: false

auth:
    type: oauth
    method: client_credentials
    tokenUrl: "https://app.loewenbytes.com/api/v1/connect/token"
    clientId: "${LOEWENBYTES_CLIENT_ID}"
    clientSecret: "${LOEWENBYTES_CLIENT_SECRET}"

headers:
    Accept: application/json
    Content-Type: application/json

steps:
    - type: forValues
      name: "Fetch translations for all locations"
      values: ["en", "de", "lld"]
      as: language
      steps:
        - type: request
          name: "Get locations in language"
          request:
              url: "https://app.loewenbytes.com/api/v1/resources/locations?languageID={{ .language }}"
              method: GET

          mergeOn: .[$ctx.language] = $res

          steps:
            - type: forEach
              name: "Get stations details"
              path: .
              as: location
              steps:
                - type: request
                  name: "Get Stations"
                  request:
                      url: "https://app.loewenbytes.com/api/v1/resources/stations?languageID={{ .language }}&locationId={{ .location.locationID }}"
                      method: GET

                  mergeOn: .stations = $res
                  resultTransformer: "[.[] | { address, locationName, name, stationID }]"

    - type: request
      name: "Get all locations"
      request:
          url: "https://app.loewenbytes.com/api/v1/resources/locations?languageID=it"
          method: GET

      mergeOn: .it = $res

      steps:
        - type: forEach
          name: "Get stations details"
          path: .
          as: location
          steps:
            - type: request
              name: "Get Stations"
              request:
                  url: "https://app.loewenbytes.com/api/v1/resources/stations?languageID=it&locationId={{ .location.locationID }}"
                  method: GET

              mergeOn: .stations = $res

              steps:
                - type: forEach
                  name: "Get single station places"
                  path: .
                  as: station
                  steps:
                    - type: request
                      name: "Get Station"
                      request:
                          url: "https://app.loewenbytes.com/api/v1/resources/station?languageID=it&stationID={{ .station.stationID }}"
                          method: GET

                      mergeOn: .places = $res.places
