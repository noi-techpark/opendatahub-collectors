rootContext: {}
stream: false

# Collector: Panocloud Webcams
# Source:  https://backend.panocloud.com/partner-api/api.php?key=${PANOCLOUD_API_KEY}
# Target:  ODH WebcamInfo endpoint

steps:

  - type: request
    name: "Fetch Panocloud Webcams"
    request:
      url: "https://backend.panocloud.com/partner-api/api.php?key=${PANOCLOUD_API_KEY}"
      method: GET
    resultTransformer: "."
