image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/dc-echarging-ocpi
  pullPolicy: IfNotPresent
  tag: 

service:
  enabled: true
  type: ClusterIP
  port: 8080
  health:
    delay: 10
    path: /health

ingress:
  enabled: true

  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"

  className: nginx
  tls:
    - hosts:
      - powy.ocpi.io.dev.testingmachine.eu
      secretName: tls-ocpi-powy
  hosts:
    - host: powy.ocpi.io.dev.testingmachine.eu
      paths: 
        - path: "/"
          pathType: Prefix
            
env:
  GIN_MODE: release
  LOG_LEVEL: DEBUG
  MQ_CLIENT: dc-echarging-ocpi-powy
  MQ_EXCHANGE: ingress
  PORT: 8080
  PROVIDER: echarging-ocpi/powy
  PULL_LOCATIONS_CRON: "0 3 * * *"
  OCPI_VERSION: "2.2.1"

envSecret:
  # List of valid tokens, no spaces etc.
  OCPI_TOKENS: ExampleToken1,ExampleToken2
  PULL_LOCATIONS_ENDPOINT: "set-after-handshake"
  PULL_TOKEN: "***"

envSecretRef:
  - name: MQ_URI 
    secret: rabbitmq-svcbind
    key: uri
