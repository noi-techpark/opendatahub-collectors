replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-collectors/dc-rest-push-skidata
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: container-registry-r

service:
  enabled: true
  type: ClusterIP
  port: 8080
  health:
    delay: 20
    path: /health

ingress:
  enabled: true

  annotations:
    cert-manager.io/issuer: "letsencrypt-prod"

  className: nginx
  tls:
    - hosts:
        - push.api.opendatahub.com
      secretName: tls-rest-push-skidata
  hosts:
    - host: push.api.opendatahub.com
      paths:
        - path: "/push/skidata/parking-stations"
          pathType: Prefix
        # Some facilities are configured vendor-side without the /push prefix.
        # Without this path those requests match the dc-rest-push "/" catch-all
        # on the same host and are dropped with a 404.
        - path: "/skidata/parking-stations"
          pathType: Prefix

env:
  LOGLEVEL: "INFO"
  PROVIDER: "skidata/parking-stations"
  MQ_CLIENT: "dc-rest-push-skidata"
  MQ_EXCHANGE: "ingress"
  SKIDATA_BASE_URL: "https://car.webhost.skidata.com"
  # The counting categories are collected as a second flow under their own
  # provider, so they land in their own collection and can be read back keyed
  # by facility. The refresh is independent of resubscription, which only
  # happens on a failed health check and can be days apart.
  SKIDATA_CATEGORIES_PROVIDER: "skidata/counting-categories"
  SKIDATA_CATEGORY_REFRESH: "1h"

  # Raw payloads go to the HTTP raw writer, not the ingress queue.
  RAW_WRITER_URL: "http://raw-writer-2.core.svc.cluster.local:8080"
  SERVICE_NAME: "dc-rest-push-skidata"
  TELEMETRY_TRACE_GRPC_ENDPOINT: tempo-distributor-discovery.monitoring.svc.cluster.local:4317

envSecretRef:
  - name: MQ_URI
    secret: rabbitmq-svcbind
    key: uri
