help me creating a skill to develop open data hub platform's data ingestion pipeline.
the pipelines are normaly composed by at least 2 components:
collector which collects/receives data and pushes as it is into the raw data lake from the provider.
tranformer which subscribes to rabbitmq channel and awaits for the raw data to perform some mapping and push it in the data silos.
there are 2 main silos target:
content, structured data and timeseries more unstructured stations + timeseries data.

fot the collectors there are many "generic" collectors to listen/poll data and we should use them as much as possibile to reuse well maintained modules.

there are plenty of example and i want the skill to explicitly state to use the official github.com/noi-techpark/opendatahub-go-sdk package.
i will provide you with documentation as well and you MUST undestand the pipeline, the available generic collectors and when to use them, and the transformers pattern.

the skill must also cover the deployment (helm, github workflow, docker build, yamlk configuration where needed) and the tests (using go-sdk).

